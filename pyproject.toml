[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it-ai-copilot"
version = "0.4.0"
description = "Reproducible IT ticket classification ML API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "pydantic>=2.7,<3", "sqlalchemy>=2.0,<3", "httpx>=0.27,<1", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
